version: '3.8'
services:
  yara:
    build: ./docker/yara
    container_name: yara_container
    volumes:
      - ./remote:/data
    depends_on:
      - db

  db:
    image: mongo:latest
    container_name: yara_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      - MONGO_INITDB_ROOT_USERNAME=yara_user
      - MONGO_INITDB_ROOT_PASSWORD=yara_password
      - MONGO_INITDB_DATABASE=yara_db

volumes:
  mongodb_data: